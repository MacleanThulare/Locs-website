        <form class="booking-form" id="booking-form">
          <div class="field">
            <label for="booking-name">Your name</label>
            <input id="booking-name" name="name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="booking-email">Email address</label>
            <input id="booking-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="booking-service">What are you looking for?</label>
            <select id="booking-service" name="service" required>
              <option value="" disabled selected>Choose a service</option>
              <option>Starter locs</option>
              <option>Retwist &amp; care</option>
              <option>Repair &amp; reshape</option>
              <option>Not sure yet</option>
            </select>
          </div>
          <div class="field">
            <label for="booking-date">Preferred date</label>
            <input id="booking-date" name="date" type="date">
          </div>
          <div class="field field-wide">
            <label for="booking-message">Anything else we should know?</label>
            <textarea id="booking-message" name="message" placeholder="Tell us about your loc goals..."></textarea>
          </div>
          <button class="button" type="submit">Request a consultation <span class="button-arrow" aria-hidden="true">↗</span></button>
          <p class="form-note">Your email app will open with your request ready to send. Please replace the sample salon email in the site code before publishing.</p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <a class="brand" href="#home"><span class="brand-mark" aria-hidden="true">R</span> ROOTED LOC STUDIO</a>
      <small>Care for your crown, from day one.</small>
      <div class="footer-links"><a href="#services">Services</a><a href="#booking">Book a visit</a><a href="#home">Back to top ↑</a></div>
    </div>
  </footer>
`;

document.querySelector("#booking-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const form = event.currentTarget;
  const details = new FormData(form);
  const subject = `Loc consultation request from ${details.get("name")}`;
  const body = [
    `Name: ${details.get("name")}`,
    `Email: ${details.get("email")}`,
    `Service: ${details.get("service")}`,
    `Preferred date: ${details.get("date") || "Flexible"}`,
    "",
    `More about their loc goals: ${details.get("message") || "Not provided"}`,
  ].join("\n");
  window.location.href = `mailto:${salonEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
});
</script>
</body>
</html>
